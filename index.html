<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>연구실 AI 스마트 서가 시스템</title>
  <style>
    :root {
      --bg-color: #1a1a24;
      --shelf-color: #5c3a21;
      --shelf-dark: #3d2514;
      --card-bg: #2a2a38;
      --accent: #6c5ce7;
      --text: #ffffff;
      --text-sub: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); overflow-x: hidden; }

    /* Auth View */
    .auth-container {
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
      background: radial-gradient(circle at center, #2c2c3e 0%, #1a1a24 100%);
    }
    .auth-box {
      background: var(--card-bg); padding: 40px; border-radius: 12px; width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #3a3a4c; text-align: center;
    }
    .auth-box h2 { margin-bottom: 20px; font-size: 22px; color: #fff; }
    .auth-box input {
      width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px;
      border: 1px solid #4a4a5c; background: #1a1a24; color: #fff; outline: none;
    }
    .auth-box button {
      width: 100%; padding: 12px; margin-top: 12px; border-radius: 6px; border: none;
      background: var(--accent); color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .auth-box button:hover { opacity: 0.9; }
    .toggle-auth { margin-top: 15px; font-size: 13px; color: var(--text-sub); cursor: pointer; text-decoration: underline; }

    /* Main View */
    .main-container { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 20px; border-bottom: 1px solid #3a3a4c; margin-bottom: 20px;
    }
    .user-info { font-size: 14px; color: var(--text-sub); }
    .btn-secondary {
      background: #4a4a5c; color: #fff; border: none; padding: 8px 16px;
      border-radius: 6px; cursor: pointer; font-size: 13px;
    }

    /* API Bar */
    .api-bar {
      display: flex; gap: 10px; margin-bottom: 20px; background: var(--card-bg);
      padding: 15px; border-radius: 8px; border: 1px solid #3a3a4c; align-items: center; flex-wrap: wrap;
    }
    .api-bar input { flex: 1; min-width: 200px; padding: 8px 12px; border-radius: 4px; border: 1px solid #4a4a5c; background: #1a1a24; color: #fff; }
    .api-status { font-size: 13px; font-weight: bold; color: var(--text-sub); margin-left: 5px; }
    .api-link { color: #8b78f6; font-size: 13px; text-decoration: underline; margin-left: 10px; }

    /* Drag Drop Area */
    .drop-zone {
      border: 2px dashed var(--accent); border-radius: 12px; padding: 30px; text-align: center;
      background: rgba(108, 92, 231, 0.05); cursor: pointer; transition: 0.2s; margin-bottom: 30px;
    }
    .drop-zone:hover { background: rgba(108, 92, 231, 0.15); }

    /* Bookshelf UI */
    .bookshelf-container {
      background: var(--shelf-dark); border-radius: 8px; padding: 20px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8); min-height: 400px;
    }
    .shelf {
      display: flex; align-items: flex-end; gap: 12px; padding: 10px 20px 0 20px;
      border-bottom: 16px solid var(--shelf-color); min-height: 160px; margin-bottom: 30px;
      box-shadow: 0 8px 10px rgba(0,0,0,0.5);
    }

    /* Book UI */
    .book {
      width: 45px; height: 130px; background: #e74c3c; border-radius: 3px 6px 6px 3px;
      cursor: pointer; position: relative; transition: transform 0.2s;
      display: flex; align-items: center; justify-content: center;
      box-shadow: -3px 0 5px rgba(0,0,0,0.3), inset -2px 0 5px rgba(255,255,255,0.2);
    }
    .book:hover { transform: translateY(-15px) scale(1.05); z-index: 10; }
    .book-title {
      writing-mode: vertical-rl; text-orientation: mixed; font-size: 11px;
      color: #fff; font-weight: bold; max-height: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Tooltip (Hover Info) */
    .book-tooltip {
      visibility: hidden; width: 180px; background-color: #000; color: #fff;
      text-align: left; border-radius: 6px; padding: 10px; position: absolute;
      z-index: 100; bottom: 140%; left: 50%; transform: translateX(-50%);
      opacity: 0; transition: opacity 0.2s; font-size: 12px; pointer-events: none;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5); border: 1px solid #555;
    }
    .book:hover .book-tooltip { visibility: visible; opacity: 1; }

    /* Modal (Click Info) */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;
    }
    .modal-content {
      background: var(--card-bg); width: 90%; max-width: 600px; padding: 30px;
      border-radius: 12px; border: 1px solid #4a4a5c; position: relative; max-height: 80vh; overflow-y: auto;
    }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; cursor: pointer; color: var(--text-sub); }
    .ai-summary { background: #1a1a24; padding: 15px; border-radius: 8px; margin-top: 15px; border-left: 4px solid var(--accent); font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>

  <!-- Auth Screen -->
  <div class="auth-container" id="authScreen">
    <div class="auth-box">
      <h2 id="authTitle">연구실 서가 로그인</h2>
      <div id="emailForm">
        <input type="email" id="emailInput" placeholder="이메일 주소" />
        <input type="password" id="passwordInput" placeholder="비밀번호" />
        <button id="emailAuthBtn">로그인 / 회원가입</button>
      </div>
      <div id="backupForm" style="display:none;">
        <input type="text" id="backupCodeInput" placeholder="백업 코드 입력" />
        <button id="backupAuthBtn">백업 코드로 접속</button>
      </div>
      <div class="toggle-auth" onclick="toggleAuthMode()">백업 코드로 로그인하기</div>
    </div>
  </div>

  <!-- Main Screen -->
  <div class="main-container" id="mainScreen">
    <header>
      <div>
        <h2>📚 Smart Lab Bookshelf</h2>
        <div class="user-info" id="userDisplay">접속 계정: -</div>
      </div>
      <div>
        <button class="btn-secondary" onclick="generateBackupCode()">백업코드 발급</button>
        <button class="btn-secondary" onclick="logout()">로그아웃</button>
      </div>
    </header>

    <div class="api-bar">
      <input type="password" id="geminiApiKey" placeholder="Gemini API Key를 입력하세요 (AI 요약 기능 활성화)" />
      <button class="btn-secondary" onclick="saveApiKey()">API 키 검증 및 저장</button>
      <span class="api-status" id="apiStatus">[미설정]</span>
      <a class="api-link" href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer">🔑 API 키 발급받기 ↗</a>
    </div>

    <div class="drop-zone" id="dropZone">
      <p>📁 여기에 파일을 드래그 & 드롭하거나 클릭하여 추가하세요.</p>
      <input type="file" id="fileInput" hidden multiple />
    </div>

    <!-- Shelf Container -->
    <div class="bookshelf-container" id="bookshelf">
      <div class="shelf" id="shelf-0"></div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <h3 id="modalTitle">파일 제목</h3>
      <p style="font-size: 12px; color: var(--text-sub); margin-top: 5px;" id="modalMeta">파일 정보</p>
      <div class="ai-summary">
        <strong>🤖 AI 문서 분석 및 요약</strong>
        <p id="modalSummary" style="margin-top: 8px;">분석 중입니다...</p>
      </div>
    </div>
  </div>

  <!-- Firebase & App Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAnZQ5wfu4zPhhun_RYG7CBZ7b0G1m1rJw",
      authDomain: "file-nang-jang-go.firebaseapp.com",
      projectId: "file-nang-jang-go",
      storageBucket: "file-nang-jang-go.firebasestorage.app",
      messagingSenderId: "500103371633",
      appId: "1:500103371633:web:cb216c06c03c0ec37634d0",
      measurementId: "G-WVYYN0JPNQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let booksData = [];
    const bookColors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c'];

    // 로컬 스토리지에 저장된 API 키 불러오기 및 검증
    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('geminiApiKey').value = savedKey;
        verifyApiKey(savedKey, false);
      }
    });

    // API 키 검증 및 저장 함수 (수정됨)
    window.saveApiKey = async function() {
      const keyInput = document.getElementById('geminiApiKey').value.trim();
      if (!keyInput) {
        updateApiStatus("[미설정]", "var(--text-sub)");
        localStorage.removeItem('gemini_api_key');
        alert("API 키를 입력해주세요.");
        return;
      }
      await verifyApiKey(keyInput, true);
    };

    async function verifyApiKey(key, showAlert = false) {
      updateApiStatus("[검증 중...]", "#f1c40f");
      try {
        // GET 요청으로 API 키 자체의 유효성을 정확히 검증
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);

        if (response.ok) {
          updateApiStatus("🟢 정상 작동중", "#2ecc71");
          localStorage.setItem('gemini_api_key', key);
          if (showAlert) alert("API 키가 정상 작동하며 저장되었습니다!");
        } else {
          updateApiStatus("🔴 API 키 오류", "#e74c3c");
          if (showAlert) alert("유효하지 않은 API 키입니다. 다시 확인해주세요.");
        }
      } catch (err) {
        updateApiStatus("🔴 검증 실패", "#e74c3c");
        if (showAlert) alert("API 키 검증 연결에 실패했습니다.");
      }
    }

    function updateApiStatus(text, color) {
      const statusEl = document.getElementById('apiStatus');
      if (statusEl) {
        statusEl.innerText = text;
        statusEl.style.color = color;
      }
    }

    // 로그인 상태 감지
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('mainScreen').style.display = 'block';
        document.getElementById('userDisplay').innerText = `접속 계정: ${user.email || '백업코드 로그인'}`;
        await loadUserData();
      } else {
        document.getElementById('authScreen').style.display = 'flex';
        document.getElementById('mainScreen').style.display = 'none';
      }
    });

    // 이메일 로그인/가입 처리
    document.getElementById('emailAuthBtn').addEventListener('click', async () => {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      if(!email || !password) return alert("이메일과 비밀번호를 입력하세요.");

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        try {
          await createUserWithEmailAndPassword(auth, email, password);
          alert("새 계정이 생성되었습니다.");
        } catch (err) {
          alert("로그인 오류: " + err.message);
        }
      }
    });

    // 백업코드 로그인 처리
    document.getElementById('backupAuthBtn').addEventListener('click', async () => {
      const code = document.getElementById('backupCodeInput').value.trim();
      if(!code) return alert("백업 코드를 입력하세요.");
      
      const docRef = doc(db, "backups", code);
      const docSnap = await getDoc(docRef);
      if(docSnap.exists()){
        const data = docSnap.data();
        booksData = data.books || [];
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('mainScreen').style.display = 'block';
        document.getElementById('userDisplay').innerText = `백업코드 접속: ${code}`;
        renderBookshelf();
      } else {
        alert("유효하지 않은 백업 코드입니다.");
      }
    });

    // 백업 코드 생성
    window.generateBackupCode = async () => {
      if(!currentUser) return alert("로그인 후 이용 가능합니다.");
      const code = 'BC-' + Math.random().toString(36).substring(2, 9).toUpperCase();
      await setDoc(doc(db, "backups", code), {
        uid: currentUser.uid,
        books: booksData
      });
      alert(`발급된 백업 코드: ${code}\n이 코드로 나중에 언제든 복구할 수 있습니다.`);
    };

    // 데이터 로드/저장
    async function loadUserData() {
      if(!currentUser) return;
      const userRef = doc(db, "users", currentUser.uid);
      const snap = await getDoc(userRef);
      if(snap.exists()) {
        booksData = snap.data().books || [];
        renderBookshelf();
      }
    }

    async function saveBookData(newBook) {
      booksData.push(newBook);
      renderBookshelf();
      if(currentUser) {
        const userRef = doc(db, "users", currentUser.uid);
        await setDoc(userRef, { books: booksData }, { merge: true });
      }
    }

    // 파일 처리 및 AI 요약
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); });
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    async function handleFiles(files) {
      const apiKey = document.getElementById('geminiApiKey').value;

      for (let file of files) {
        const fileData = {
          id: Date.now() + Math.random().toString(),
          name: file.name,
          size: (file.size / 1024).toFixed(1) + ' KB',
          type: file.type || 'unknown',
          color: bookColors[Math.floor(Math.random() * bookColors.length)],
          summary: "AI 분석을 진행하지 않았거나 실패했습니다."
        };

        if (apiKey) {
          fileData.summary = await analyzeWithGemini(file, apiKey);
        } else {
          fileData.summary = "API Key를 상단에 입력하시면 자동으로 AI 분석 내용이 저장됩니다.";
        }

        await saveBookData(fileData);
      }
    }

    // Gemini API 연동 함수 (오류 메시지 처리 강화)
    async function analyzeWithGemini(file, apiKey) {
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `다음 파일 이름과 확장자를 참고하여 이 파일이 연구실에서 어떤 용도로 사용되는 문서인지 3줄 이내로 핵심 요약해줘. 파일명: ${file.name}` }] }]
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          return `AI 분석 실패: ${errData.error?.message || 'API 응답 오류'}`;
        }

        const result = await response.json();
        return result.candidates[0].content.parts[0].text;
      } catch (err) {
        return "AI 분석 도중 네트워크 오류가 발생했습니다.";
      }
    }

    // 책장 렌더링
    function renderBookshelf() {
      const bookshelf = document.getElementById('bookshelf');
      bookshelf.innerHTML = '';
      
      let currentShelf = document.createElement('div');
      currentShelf.className = 'shelf';
      bookshelf.appendChild(currentShelf);

      booksData.forEach((book, index) => {
        if(index > 0 && index % 15 === 0) {
          currentShelf = document.createElement('div');
          currentShelf.className = 'shelf';
          bookshelf.appendChild(currentShelf);
        }

        const bookEl = document.createElement('div');
        bookEl.className = 'book';
        bookEl.style.backgroundColor = book.color;
        bookEl.innerHTML = `
          <span class="book-title">${book.name}</span>
          <div class="book-tooltip">
            <strong>${book.name}</strong><br/>
            크기: ${book.size}<br/>
            타입: ${book.type}
          </div>
        `;

        bookEl.addEventListener('click', () => openModal(book));
        currentShelf.appendChild(bookEl);
      });
    }

    // 모달 제어
    window.openModal = (book) => {
      document.getElementById('modalTitle').innerText = book.name;
      document.getElementById('modalMeta').innerText = `용량: ${book.size} | 유형: ${book.type}`;
      document.getElementById('modalSummary').innerText = book.summary;
      document.getElementById('detailModal').style.display = 'flex';
    };

    window.closeModal = () => {
      document.getElementById('detailModal').style.display = 'none';
    };

    window.logout = () => signOut(auth);

    window.toggleAuthMode = () => {
      const eForm = document.getElementById('emailForm');
      const bForm = document.getElementById('backupForm');
      if(eForm.style.display === 'none') {
        eForm.style.display = 'block'; bForm.style.display = 'none';
      } else {
        eForm.style.display = 'none'; bForm.style.display = 'block';
      }
    };
  </script>
</body>
</html>
