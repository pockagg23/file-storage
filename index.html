<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>연구실 AI 스마트 서가 시스템</title>
  <style>
    :root {
      --bg-color: #1a1a24;
      --shelf-color: #5c3a21;
      --shelf-dark: #3d2514;
      --card-bg: #2a2a38;
      --accent: #6c5ce7;
      --accent-hover: #5b4cc4;
      --success: #2ecc71;
      --danger: #e74c3c;
      --danger-hover: #c0392b;
      --text: #ffffff;
      --text-sub: #a0a0b0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); overflow-x: hidden; }

    /* Auth Screen */
    .auth-container {
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
      background: radial-gradient(circle at center, #2c2c3e 0%, #1a1a24 100%);
    }
    .auth-box {
      background: var(--card-bg); padding: 40px; border-radius: 12px; width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #3a3a4c; text-align: center;
    }
    .auth-box h2 { margin-bottom: 20px; font-size: 22px; color: #fff; }
    .auth-box input {
      width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px;
      border: 1px solid #4a4a5c; background: #1a1a24; color: #fff; outline: none;
    }
    .auth-box button {
      width: 100%; padding: 12px; margin-top: 12px; border-radius: 6px; border: none;
      background: var(--accent); color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .auth-box button:hover { background: var(--accent-hover); }
    .toggle-auth { margin-top: 15px; font-size: 13px; color: var(--text-sub); cursor: pointer; text-decoration: underline; }

    /* Main Screen */
    .main-container { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
    header {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 20px; border-bottom: 1px solid #3a3a4c; margin-bottom: 20px;
    }
    .user-info { font-size: 14px; color: var(--text-sub); }
    .btn-secondary {
      background: #4a4a5c; color: #fff; border: none; padding: 8px 16px;
      border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.2s;
    }
    .btn-secondary:hover { background: #5a5a6c; }
    .btn-success {
      background: var(--success); color: #fff; border: none; padding: 8px 16px;
      border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s;
    }
    .btn-success:hover { opacity: 0.9; }
    .btn-danger {
      background: var(--danger); color: #fff; border: none; padding: 8px 16px;
      border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s;
    }
    .btn-danger:hover { background: var(--danger-hover); }

    /* API Bar */
    .api-bar {
      display: flex; gap: 10px; margin-bottom: 20px; background: var(--card-bg);
      padding: 15px; border-radius: 8px; border: 1px solid #3a3a4c; align-items: center; flex-wrap: wrap;
    }
    .api-bar input { flex: 1; min-width: 220px; padding: 8px 12px; border-radius: 4px; border: 1px solid #4a4a5c; background: #1a1a24; color: #fff; }
    .api-status { font-size: 13px; font-weight: bold; color: var(--text-sub); margin-left: 5px; }
    .api-link { color: #8b78f6; font-size: 13px; text-decoration: underline; margin-left: 10px; }

    /* Drop Zone */
    .drop-zone {
      border: 2px dashed var(--accent); border-radius: 12px; padding: 30px; text-align: center;
      background: rgba(108, 92, 231, 0.05); cursor: pointer; transition: 0.2s; margin-bottom: 30px;
    }
    .drop-zone:hover { background: rgba(108, 92, 231, 0.15); }

    /* Bookshelf UI */
    .bookshelf-container {
      background: var(--shelf-dark); border-radius: 8px; padding: 20px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8); min-height: 400px;
    }
    .shelf {
      display: flex; align-items: flex-end; gap: 12px; padding: 10px 20px 0 20px;
      border-bottom: 16px solid var(--shelf-color); min-height: 160px; margin-bottom: 30px;
      box-shadow: 0 8px 10px rgba(0,0,0,0.5);
    }

    /* Book UI */
    .book {
      width: 48px; height: 135px; background: #e74c3c; border-radius: 3px 6px 6px 3px;
      cursor: pointer; position: relative; transition: transform 0.2s;
      display: flex; align-items: center; justify-content: center;
      box-shadow: -3px 0 5px rgba(0,0,0,0.3), inset -2px 0 5px rgba(255,255,255,0.2);
    }
    .book:hover { transform: translateY(-15px) scale(1.05); z-index: 10; }
    .book-title {
      writing-mode: vertical-rl; text-orientation: mixed; font-size: 11px;
      color: #fff; font-weight: bold; max-height: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .book-tooltip {
      visibility: hidden; width: 180px; background-color: #000; color: #fff;
      text-align: left; border-radius: 6px; padding: 10px; position: absolute;
      z-index: 100; bottom: 140%; left: 50%; transform: translateX(-50%);
      opacity: 0; transition: opacity 0.2s; font-size: 12px; pointer-events: none;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5); border: 1px solid #555;
    }
    .book:hover .book-tooltip { visibility: visible; opacity: 1; }

    /* Modal & Chat Interface */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75); z-index: 1000; justify-content: center; align-items: center;
    }
    .modal-content {
      background: var(--card-bg); width: 90%; max-width: 680px; padding: 25px;
      border-radius: 12px; border: 1px solid #4a4a5c; position: relative; max-height: 90vh;
      display: flex; flex-direction: column; gap: 15px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid #3a3a4c; padding-bottom: 12px; }
    .close-btn { font-size: 24px; cursor: pointer; color: var(--text-sub); line-height: 1; }
    
    .ai-summary { background: #1a1a24; padding: 12px 15px; border-radius: 8px; border-left: 4px solid var(--accent); font-size: 13px; line-height: 1.5; }

    .chat-section {
      display: flex; flex-direction: column; flex: 1; min-height: 250px; max-height: 320px;
      background: #15151e; border-radius: 8px; border: 1px solid #3a3a4c; overflow: hidden;
    }
    .chat-title { background: #222230; padding: 8px 12px; font-size: 12px; font-weight: bold; color: var(--text-sub); border-bottom: 1px solid #3a3a4c; }
    .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
    
    .message { max-width: 80%; padding: 8px 12px; border-radius: 8px; line-height: 1.4; word-break: break-word; }
    .message.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 2px; }
    .message.ai { align-self: flex-start; background: #2a2a38; color: #e0e0e0; border: 1px solid #3a3a4c; border-bottom-left-radius: 2px; }

    .chat-input-row { display: flex; gap: 8px; padding: 10px; background: #1a1a24; border-top: 1px solid #3a3a4c; }
    .chat-input-row input { flex: 1; padding: 8px 12px; border-radius: 4px; border: 1px solid #4a4a5c; background: #2a2a38; color: #fff; font-size: 13px; outline: none; }
    .chat-input-row button { padding: 8px 16px; border-radius: 4px; border: none; background: var(--accent); color: #fff; font-weight: bold; cursor: pointer; font-size: 13px; }
    .chat-input-row button:hover { background: var(--accent-hover); }
  </style>
</head>
<body>

  <!-- Auth Screen -->
  <div class="auth-container" id="authScreen">
    <div class="auth-box">
      <h2>연구실 서가 로그인</h2>
      <div id="emailForm">
        <input type="email" id="emailInput" placeholder="이메일 주소" />
        <input type="password" id="passwordInput" placeholder="비밀번호" />
        <button id="emailAuthBtn">로그인 / 회원가입</button>
      </div>
      <div id="backupForm" style="display:none;">
        <input type="text" id="backupCodeInput" placeholder="백업 코드 입력" />
        <button id="backupAuthBtn">백업 코드로 접속</button>
      </div>
      <div class="toggle-auth" onclick="toggleAuthMode()">백업 코드로 로그인하기</div>
    </div>
  </div>

  <!-- Main Screen -->
  <div class="main-container" id="mainScreen">
    <header>
      <div>
        <h2>📚 Smart Lab Bookshelf</h2>
        <div class="user-info" id="userDisplay">접속 계정: -</div>
      </div>
      <div>
        <button class="btn-secondary" onclick="generateBackupCode()">백업코드 발급</button>
        <button class="btn-secondary" onclick="logout()">로그아웃</button>
      </div>
    </header>

    <div class="api-bar">
      <input type="password" id="geminiApiKey" placeholder="Gemini API Key를 입력하세요" />
      <button class="btn-secondary" onclick="saveApiKey()">API 키 검증 및 저장</button>
      <span class="api-status" id="apiStatus">[미설정]</span>
      <a class="api-link" href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer">🔑 API 키 발급받기 ↗</a>
    </div>

    <div class="drop-zone" id="dropZone">
      <p>📁 여기에 파일을 드래그 & 드롭하거나 클릭하여 추가하세요.</p>
      <input type="file" id="fileInput" hidden multiple />
    </div>

    <!-- Bookshelf -->
    <div class="bookshelf-container" id="bookshelf">
      <div class="shelf"></div>
    </div>
  </div>

  <!-- Detail & AI Chat Modal -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h3 id="modalTitle">파일 제목</h3>
          <p style="font-size: 12px; color: var(--text-sub); margin-top: 4px;" id="modalMeta">파일 정보</p>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <button class="btn-success" id="downloadBtn">📥 다운로드</button>
          <button class="btn-danger" id="deleteBtn">🗑️ 삭제</button>
          <span class="close-btn" onclick="closeModal()">&times;</span>
        </div>
      </div>

      <div class="ai-summary">
        <strong>🤖 AI 문서 개요 요약</strong>
        <p id="modalSummary" style="margin-top: 6px;">요약 정보를 불러오는 중입니다...</p>
      </div>

      <div class="chat-section">
        <div class="chat-title">💬 파일 전용 AI 질의응답</div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="이 파일에 대해 질문해보세요..." onkeypress="handleChatKeyPress(event)"/>
          <button onclick="sendChatMessage()">전송</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAnZQ5wfu4zPhhun_RYG7CBZ7b0G1m1rJw",
      authDomain: "file-nang-jang-go.firebaseapp.com",
      projectId: "file-nang-jang-go",
      storageBucket: "file-nang-jang-go.firebasestorage.app",
      messagingSenderId: "500103371633",
      appId: "1:500103371633:web:cb216c06c03c0ec37634d0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let booksData = [];
    let currentActiveBook = null;
    let cachedActiveModel = null;
    const fileBlobs = {};
    const bookColors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6', '#e67e22', '#1abc9c'];

    // ListModels 호출을 통한 사용 가능 모델 실시간 검색
    async function getAvailableModel(apiKey) {
      if (cachedActiveModel) return cachedActiveModel;

      const listUrl = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;
      const res = await fetch(listUrl);
      const data = await res.json();

      if (!res.ok || !data.models || data.models.length === 0) {
        throw new Error(data.error?.message || "사용 가능한 모델 목록을 불러올 수 없습니다.");
      }

      // generateContent 지원 모델 필터링
      const validModels = data.models.filter(m => 
        m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent")
      );

      if (validModels.length === 0) {
        throw new Error("generateContent를 지원하는 활성 모델을 찾을 수 없습니다.");
      }

      // 'flash'가 포함된 모델 우선 선택, 없으면 지원하는 첫 번째 모델 선택
      const flashModel = validModels.find(m => m.name.includes("flash"));
      const selectedModel = flashModel ? flashModel.name : validModels[0].name;

      cachedActiveModel = selectedModel;
      return selectedModel;
    }

    // 동적 탐색 모델을 통한 API 요청 처리
    async function requestGeminiAPI(apiKey, promptText) {
      try {
        const modelName = await getAvailableModel(apiKey);
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=${apiKey}`;
        
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }]
          })
        });

        const data = await response.json();

        if (response.ok && data.candidates?.[0]?.content?.parts?.[0]?.text) {
          return { success: true, text: data.candidates[0].content.parts[0].text, model: modelName };
        } else if (data.error) {
          cachedActiveModel = null;
          return { success: false, error: data.error.message };
        } else {
          return { success: false, error: "알 수 없는 API 응답 형태입니다." };
        }
      } catch (err) {
        cachedActiveModel = null;
        return { success: false, error: err.message || "네트워크 통신 오류가 발생했습니다." };
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('geminiApiKey').value = savedKey;
        verifyApiKey(savedKey, false);
      }
    });

    window.saveApiKey = async function() {
      const keyInput = document.getElementById('geminiApiKey').value;
      const cleanKey = keyInput ? keyInput.trim() : '';

      if (!cleanKey) {
        updateApiStatus("[미설정]", "var(--text-sub)");
        localStorage.removeItem('gemini_api_key');
        alert("API 키를 입력해주세요.");
        return;
      }
      await verifyApiKey(cleanKey, true);
    };

    async function verifyApiKey(key, showAlert = false) {
      cachedActiveModel = null; // 재검증 시 모델 캐시 초기화
      updateApiStatus("[검증 중...]", "#f1c40f");
      const res = await requestGeminiAPI(key, "연동 테스트");

      if (res.success) {
        const displayModel = res.model.replace("models/", "");
        updateApiStatus(`🟢 정상 작동중 (${displayModel})`, "#2ecc71");
        localStorage.setItem('gemini_api_key', key);
        if (showAlert) alert(`API 키가 성공적으로 연동되었습니다!
탐색된 지원 모델: ${displayModel}`);
      } else {
        updateApiStatus("🔴 API 키 오류", "#e74c3c");
        if (showAlert) alert(`API 키 연동 실패:
${res.error}`);
      }
    }

    function updateApiStatus(text, color) {
      const statusEl = document.getElementById('apiStatus');
      if (statusEl) {
        statusEl.innerText = text;
        statusEl.style.color = color;
      }
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('mainScreen').style.display = 'block';
        document.getElementById('userDisplay').innerText = `접속 계정: ${user.email || '백업코드 접속'}`;
        await loadUserData();
      } else {
        document.getElementById('authScreen').style.display = 'flex';
        document.getElementById('mainScreen').style.display = 'none';
      }
    });

    document.getElementById('emailAuthBtn').addEventListener('click', async () => {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      if(!email || !password) return alert("이메일과 비밀번호를 입력하세요.");

      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (e) {
        try {
          await createUserWithEmailAndPassword(auth, email, password);
          alert("새 계정이 생성되었습니다.");
        } catch (err) {
          alert("로그인 오류: " + err.message);
        }
      }
    });

    document.getElementById('backupAuthBtn').addEventListener('click', async () => {
      const code = document.getElementById('backupCodeInput').value.trim();
      if(!code) return alert("백업 코드를 입력하세요.");
      
      const docRef = doc(db, "backups", code);
      const docSnap = await getDoc(docRef);
      if(docSnap.exists()){
        booksData = docSnap.data().books || [];
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('mainScreen').style.display = 'block';
        document.getElementById('userDisplay').innerText = `백업코드 접속: ${code}`;
        renderBookshelf();
      } else {
        alert("유효하지 않은 백업 코드입니다.");
      }
    });

    window.generateBackupCode = async () => {
      if(!currentUser) return alert("로그인 후 이용 가능합니다.");
      const code = 'BC-' + Math.random().toString(36).substring(2, 9).toUpperCase();
      await setDoc(doc(db, "backups", code), { uid: currentUser.uid, books: booksData });
      alert(`발급된 백업 코드: ${code}`);
    };

    async function loadUserData() {
      if(!currentUser) return;
      const snap = await getDoc(doc(db, "users", currentUser.uid));
      if(snap.exists()) {
        booksData = snap.data().books || [];
        renderBookshelf();
      }
    }

    async function saveBookData(newBook) {
      booksData.push(newBook);
      renderBookshelf();
      if(currentUser) {
        await setDoc(doc(db, "users", currentUser.uid), { books: booksData }, { merge: true });
      }
    }

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => e.preventDefault());
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    async function handleFiles(files) {
      const apiKey = localStorage.getItem('gemini_api_key');

      for (let file of files) {
        const fileId = Date.now() + '-' + Math.random().toString(36).substring(2, 7);
        fileBlobs[fileId] = URL.createObjectURL(file);

        const fileData = {
          id: fileId,
          name: file.name,
          size: (file.size / 1024).toFixed(1) + ' KB',
          type: file.type || 'unknown',
          color: bookColors[Math.floor(Math.random() * bookColors.length)],
          summary: "AI 요약 정보가 없습니다.",
          chatHistory: [{ role: 'ai', text: `안녕하세요! **${file.name}** 파일 관련 질문을 입력해 주세요.` }]
        };

        if (apiKey) {
          const prompt = `다음 파일의 예상 용도와 핵심 내용을 2줄로 간결하게 요약해줘. 파일명: ${file.name}`;
          const res = await requestGeminiAPI(apiKey, prompt);
          if (res.success) fileData.summary = res.text;
        }

        await saveBookData(fileData);
      }
    }

    function renderBookshelf() {
      const bookshelf = document.getElementById('bookshelf');
      bookshelf.innerHTML = '';
      
      let currentShelf = document.createElement('div');
      currentShelf.className = 'shelf';
      bookshelf.appendChild(currentShelf);

      booksData.forEach((book, index) => {
        if(index > 0 && index % 15 === 0) {
          currentShelf = document.createElement('div');
          currentShelf.className = 'shelf';
          bookshelf.appendChild(currentShelf);
        }

        const bookEl = document.createElement('div');
        bookEl.className = 'book';
        bookEl.style.backgroundColor = book.color;
        bookEl.innerHTML = `
          <span class="book-title">${book.name}</span>
          <div class="book-tooltip">
            <strong>${book.name}</strong><br/>
            용량: ${book.size}<br/>
            타입: ${book.type}
          </div>
        `;

        bookEl.addEventListener('click', () => openModal(book));
        currentShelf.appendChild(bookEl);
      });
    }

    window.openModal = (book) => {
      currentActiveBook = book;
      if (!currentActiveBook.chatHistory) {
        currentActiveBook.chatHistory = [{ role: 'ai', text: `안녕하세요! **${book.name}** 파일 관련 질문을 입력하세요.` }];
      }

      document.getElementById('modalTitle').innerText = book.name;
      document.getElementById('modalMeta').innerText = `용량: ${book.size} | 유형: ${book.type}`;
      document.getElementById('modalSummary').innerText = book.summary;
      
      document.getElementById('downloadBtn').onclick = () => downloadFile(book);
      document.getElementById('deleteBtn').onclick = () => deleteFile(book);

      renderChatMessages();
      document.getElementById('detailModal').style.display = 'flex';
    };

    async function deleteFile(book) {
      if (!confirm(`'${book.name}' 파일을 서재 목록에서 삭제하시겠습니까?`)) {
        return;
      }

      // 서재 데이터 배열에서 삭제
      booksData = booksData.filter(b => b.id !== book.id);

      // 메모리 할당된 Blob 삭제
      if (fileBlobs[book.id]) {
        URL.revokeObjectURL(fileBlobs[book.id]);
        delete fileBlobs[book.id];
      }

      // Firestore 동기화
      if (currentUser) {
        await setDoc(doc(db, "users", currentUser.uid), { books: booksData });
      }

      renderBookshelf();
      closeModal();
      alert(`'${book.name}' 파일이 서재에서 삭제되었습니다.`);
    }

    function downloadFile(book) {
      let downloadUrl = fileBlobs[book.id];
      
      if (!downloadUrl) {
        const dummyContent = `[파일 정보]
파일명: ${book.name}
용량: ${book.size}
AI 요약: ${book.summary}`;
        const blob = new Blob([dummyContent], { type: 'text/plain;charset=utf-8' });
        downloadUrl = URL.createObjectURL(blob);
      }

      const a = document.createElement('a');
      a.href = downloadUrl;
      a.download = book.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function renderChatMessages() {
      const container = document.getElementById('chatMessages');
      container.innerHTML = '';

      if (!currentActiveBook || !currentActiveBook.chatHistory) return;

      currentActiveBook.chatHistory.forEach(msg => {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${msg.role}`;
        msgDiv.innerHTML = msg.text.replace(/\n/g, '<br/>');
        container.appendChild(msgDiv);
      });

      container.scrollTop = container.scrollHeight;
    }

    window.sendChatMessage = async () => {
      const inputEl = document.getElementById('chatInput');
      const text = inputEl.value.trim();
      if (!text || !currentActiveBook) return;

      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        alert("상단에 Gemini API Key를 등록해야 대화가 가능합니다.");
        return;
      }

      currentActiveBook.chatHistory.push({ role: 'user', text: text });
      inputEl.value = '';
      renderChatMessages();

      currentActiveBook.chatHistory.push({ role: 'ai', text: '<i>답변 생성 중...</i>' });
      renderChatMessages();

      const prompt = `문서 파일명: ${currentActiveBook.name}\n문서 요약: ${currentActiveBook.summary}\n\n질문: ${text}\n위 문서 내용을 참고해 명확하게 답변해줘.`;
      const res = await requestGeminiAPI(apiKey, prompt);

      currentActiveBook.chatHistory.pop();

      if (res.success) {
        currentActiveBook.chatHistory.push({ role: 'ai', text: res.text });
      } else {
        currentActiveBook.chatHistory.push({ role: 'ai', text: `⚠️ 호출 오류: ${res.error}` });
      }

      renderChatMessages();

      if (currentUser) {
        await setDoc(doc(db, "users", currentUser.uid), { books: booksData }, { merge: true });
      }
    };

    window.handleChatKeyPress = (e) => {
      if (e.key === 'Enter') window.sendChatMessage();
    };

    window.closeModal = () => {
      document.getElementById('detailModal').style.display = 'none';
      currentActiveBook = null;
    };

    window.logout = () => signOut(auth);

    window.toggleAuthMode = () => {
      const eForm = document.getElementById('emailForm');
      const bForm = document.getElementById('backupForm');
      if(eForm.style.display === 'none') {
        eForm.style.display = 'block'; bForm.style.display = 'none';
      } else {
        eForm.style.display = 'none'; bForm.style.display = 'block';
      }
    };
  </script>
</body>
</html>
